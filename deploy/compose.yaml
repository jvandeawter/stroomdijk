# Stroomdijk op de Pi. Eigen compose-project, los van alles in ~/docker.
# Starten:  cd ~/stroomdijk && docker compose up -d
# Weghalen: cd ~/stroomdijk && docker compose down
name: stroomdijk

services:
  stroomdijk-ha:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: stroomdijk-ha
    restart: unless-stopped
    # host-netwerk is nodig om het netwerk af te zoeken (mDNS, SSDP, DHCP)
    network_mode: host
    # geen /run/dbus en geen extra rechten: Bluetooth blijft bij de andere Home Assistant
    cpus: 1.0
    mem_limit: 1g   # let op: werkt alleen als de kernel geheugen-cgroups aan heeft
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ./ha-config:/config
      - /etc/localtime:/etc/localtime:ro

  stroomdijk:
    build: ./app
    image: stroomdijk-app:dev
    container_name: stroomdijk
    restart: unless-stopped
    # eigen bridge-netwerk; alleen poort 8090 naar buiten
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 0.5
    mem_limit: 256m
    environment:
      - TZ=Europe/Amsterdam
      # 1 = nepwaarden (om het dashboard te bekijken), 0 = echte gegevens uit stroomdijk-ha
      - STROOMDIJK_DEMO=${STROOMDIJK_DEMO:-1}
      - STROOMDIJK_HA_URL=http://host.docker.internal:8124
      - STROOMDIJK_GEHEIM=/run/geheim
      - STROOMDIJK_DATA=/data
    volumes:
      - ./geheim:/run/geheim
      - ./data:/data
    depends_on:
      - stroomdijk-ha

[project]
name = "stroomdijk"
version = "0.1.0"
description = "Stroomdijk: al je energie op één plek"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-aiohttp>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["stroomdijk*"]

[tool.setuptools.package-data]
stroomdijk = ["*.json", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

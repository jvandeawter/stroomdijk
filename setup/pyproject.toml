[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stroomdijk-setup"
version = "0.1.0"
description = "Stroomdijk: het kastje op de wifi zetten via een eigen hotspot"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9,<4", "dbus-fast>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-aiohttp>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["stroomdijk_setup*"]

[tool.setuptools.package-data]
stroomdijk_setup = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
